    body {
      background-color: #f9f9f9;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card-tip {
      width: 90%;
      max-width: 400px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      text-align: center;
      padding: 30px 20px;
      position: relative;
      transition: transform 0.3s ease;
    }

    .card-tip:hover {
      transform: translateY(-5px);
    }

    .icon-tip {
      font-size: 5rem;
      color: #0d6efd;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .tip-text {
      font-size: 1.2rem;
      font-weight: 500;
      color: #333;
      margin-bottom: 25px;
    }

    .btn-share, .btn-detail {
      border-radius: 50px;
      padding: 10px 25px;
      font-weight: 500;
      margin: 5px;
    }

    footer {
      position: fixed;
      bottom: 10px;
      text-align: center;
      width: 100%;
      color: #777;
      font-size: 0.9rem;
    }

    .watermark {
      position: absolute;
      bottom: 10px;
      right: 15px;
      font-size: 0.8rem;
      color: #aaa;

  // COMPARTIR con compatibilidad total
  document.getElementById("shareBtn").addEventListener("click", async () => {
    const shareBtn = document.getElementById("shareBtn");
    const detailBtn = document.getElementById("detailBtn");
    shareBtn.style.display = "none";
    detailBtn.style.display = "none";

    const card = document.getElementById("tipCard");
    const canvas = await html2canvas(card);

    shareBtn.style.display = "inline-block";
    detailBtn.style.display = "inline-block";

    canvas.toBlob(async blob => {
      const file = new File([blob], "tip-del-dia.png", { type: "image/png" });
      
      // ✅ Caso 1: navegador soporta compartir archivos
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: "💡 Tip del día - #SoyMasterSeguro",
          text: `${tip.texto}\n\nSigue más tips en TikTok 👉 @soy.masterseguro`,
        });
      } 
      // ✅ Caso 2: navegador solo soporta texto
      else if (navigator.share) {
        await navigator.share({
          title: "💡 Tip de seguridad informática",
          text: `${tip.texto}\n\n#SoyMasterSeguro\nSigue en TikTok 👉 https://www.tiktok.com/@soy.masterseguro`,
        });

      else {
        const link = document.createElement("a");
        link.download = "tip-del-dia.png";
        link.href = URL.createObjectURL(blob);
        link.click();
      }
