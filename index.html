<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tips de Seguridad Informática</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    body {
      background-color: #f9f9f9;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card-tip {
      width: 90%;
      max-width: 400px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      text-align: center;
      padding: 30px 20px;
      position: relative;
      transition: transform 0.3s ease;
    }

    .card-tip:hover {
      transform: translateY(-5px);
    }

    .icon-tip {
      font-size: 5rem;
      color: #0d6efd;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .tip-text {
      font-size: 1.2rem;
      font-weight: 500;
      color: #333;
      margin-bottom: 25px;
    }

    .btn-share, .btn-detail {
      border-radius: 50px;
      padding: 10px 25px;
      font-weight: 500;
      margin: 5px;
    }

    footer {
      position: fixed;
      bottom: 10px;
      text-align: center;
      width: 100%;
      color: #777;
      font-size: 0.9rem;
    }

    .watermark {
      position: absolute;
      bottom: 10px;
      right: 15px;
      font-size: 0.8rem;
      color: #aaa;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="tipCard" class="card-tip">
    <i id="iconTip" class="bi bi-shield-lock icon-tip"></i>
    <div id="tipText" class="tip-text">Cargando tip...</div>
    <button id="detailBtn" class="btn btn-outline-primary btn-detail">
      <i class="bi bi-info-circle"></i> Ver más
    </button>
    <button id="shareBtn" class="btn btn-primary btn-share">
      <i class="bi bi-share"></i> Compartir tip
    </button>
    <div class="watermark">#SoyMasterSeguro 💡</div>
  </div>

 <footer>
  💡 Tip Seguridad Informática — 
  <a href="https://www.tiktok.com/@soy.masterseguro?_t=ZN-90wIS5r6GDm&_r=1" 
     target="_blank" 
     class="text-decoration-none text-dark fw-semibold">
     <i class="bi bi-tiktok"></i> @soy.masterseguro
  </a>
</footer>

  <!-- Modal de detalles -->
  <div class="modal fade" id="tipModal" tabindex="-1" aria-labelledby="tipModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content shadow-lg rounded-4">
        <div class="modal-header bg-light">
          <h5 class="modal-title fw-bold" id="tipModalLabel">Detalles del Tip</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body fs-6" id="tipModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  const tips = [
    { 
      texto: "Usa contraseñas únicas y seguras para cada cuenta.",
      icono: "bi-shield-lock",
      detalle: "Crea contraseñas con al menos 12 caracteres, combinando letras, números y símbolos. Evita usar datos personales."
    },
    { 
      texto: "Activa la verificación en dos pasos en tus redes sociales.",
      icono: "bi-shield-check",
      detalle: "Activa esta opción en la configuración de seguridad de tus cuentas. Añade una capa extra de protección frente a robos."
    },
    { 
      texto: "No compartas información personal en sitios no seguros.",
      icono: "bi-exclamation-triangle",
      detalle: "Asegúrate de que el sitio tenga HTTPS en la barra de direcciones. Si no lo tiene, evita ingresar datos personales."
    },
    { 
      texto: "Evita conectarte a redes Wi-Fi públicas sin VPN.",
      icono: "bi-wifi-off",
      detalle: "Las redes públicas pueden ser interceptadas. Usa una VPN confiable si necesitas conectarte en lugares públicos."
    },
    { 
      texto: "Haz copias de seguridad de tus archivos importantes.",
      icono: "bi-cloud-arrow-up",
      detalle: "Usa servicios en la nube como Google Drive o OneDrive. Programa copias automáticas semanales."
    },
    { 
      texto: "Desconfía de correos sospechosos: pueden ser phishing.",
      icono: "bi-envelope-exclamation",
      detalle: "No abras enlaces o adjuntos de correos desconocidos. Verifica la dirección del remitente cuidadosamente."
    },
    { 
      texto: "No instales software de fuentes desconocidas.",
      icono: "bi-bug",
      detalle: "Descarga programas solo desde sitios oficiales o tiendas reconocidas como Microsoft Store o Play Store."
    },
    { 
      texto: "Actualiza tus programas frecuentemente para corregir vulnerabilidades.",
      icono: "bi-arrow-repeat",
      detalle: "Activa las actualizaciones automáticas del sistema operativo y las aplicaciones críticas."
    },
    { 
      texto: "Usa un gestor de contraseñas para mayor seguridad.",
      icono: "bi-key",
      detalle: "Prueba gestores como Bitwarden o 1Password. Te ayudan a generar y recordar contraseñas seguras."
    },
    { 
      texto: "No uses la misma contraseña en diferentes plataformas.",
      icono: "bi-lock",
      detalle: "Cada cuenta debe tener una contraseña distinta. Así evitas que un hackeo afecte todas tus cuentas."
    }
  ];

  // Tip aleatorio
  const tip = tips[Math.floor(Math.random() * tips.length)];

  // Mostrar el tip
  document.getElementById("iconTip").className = `bi ${tip.icono} icon-tip`;
  document.getElementById("tipText").innerText = tip.texto;

  // Mostrar detalles en modal
  document.getElementById("detailBtn").addEventListener("click", () => {
    document.getElementById("tipModalBody").innerText = tip.detalle;
    const modal = new bootstrap.Modal(document.getElementById("tipModal"));
    modal.show();
  });

  // Compartir como imagen (sin los botones)
  document.getElementById("shareBtn").addEventListener("click", async () => {
    const shareBtn = document.getElementById("shareBtn");
    const detailBtn = document.getElementById("detailBtn");
    shareBtn.style.display = "none";
    detailBtn.style.display = "none";

    const card = document.getElementById("tipCard");
    const canvas = await html2canvas(card);
    
    shareBtn.style.display = "inline-block";
    detailBtn.style.display = "inline-block";

    canvas.toBlob(blob => {
      const file = new File([blob], "tip-del-dia.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({
          files: [file],
          title: "Tip del día 💡",
          text: tip.texto
        });
      } else {
        const link = document.createElement("a");
        link.download = "tip-del-dia.png";
        link.href = URL.createObjectURL(blob);
        link.click();
      }
    });
  });
  </script>

</body>
</html>
